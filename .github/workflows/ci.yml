name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uvx ruff@0.16.10 check .
      - run: uvx ruff@0.16.10 format --check .
      - name: README figures and numbers match the committed results
        run: uv run --locked --script scripts/readme_figures.py --check
